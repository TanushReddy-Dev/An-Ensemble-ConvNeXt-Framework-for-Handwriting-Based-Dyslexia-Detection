<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Workspace unavailable | PRISM</title>
    <meta name="theme-color" content="#eef0f3" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/assets/ui/recovery.css" />
  </head>
  <body class="static-error">
    <main class="workspace-error">
      <a class="brand" href="/">
        <img
          src="/assets/brand/prism-symbol.webp"
          width="28"
          height="28"
          alt=""
        />
        <span>PRISM</span>
      </a>
      <div class="workspace-error-body">
        <p class="workspace-error-code">500</p>
        <h1>The workspace could not open.</h1>
        <p>Try opening the overview again in a moment.</p>
        <div class="workspace-error-actions">
          <a class="btn btn--primary" href="/">Back to overview</a>
        </div>
      </div>
      <img
        class="workspace-error-art"
        src="/assets/brand/prism-mark.webp"
        width="384"
        height="384"
        alt=""
      />
    </main>
  </body>
</html>
