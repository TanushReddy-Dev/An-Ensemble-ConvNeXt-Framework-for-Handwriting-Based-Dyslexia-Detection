<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>PRISM Design Studio</title>
    <link rel="stylesheet" href="studio.css" />
    <script type="module" src="studio.js"></script>
  </head>
  <body class="studio">
    <header class="studio-head">
      <div class="identity"><i></i> PRISM <span>Design studio</span></div>
      <a href="/">Open current app ↗</a>
    </header>
    <main>
      <div class="intro">
        <h1>Three ways to see<br />PRISM.</h1>
        <p>
          Compare each screen, choose what works, and copy your picks when
          you’re ready. These prototypes use sample content.
        </p>
      </div>
      <nav class="page-tabs" id="pages" aria-label="Pages to compare"></nav>
      <div class="studio-tools">
        <h2 id="page-name"></h2>
        <div class="tools">
          <div class="viewport" aria-label="Preview size">
            <button data-device="desktop" aria-pressed="true">Desktop</button
            ><button data-device="phone" aria-pressed="false">Phone</button>
          </div>
          <button id="copy" class="copy">
            Copy picks <span id="count">0</span>
          </button>
        </div>
      </div>
      <div id="options" class="option-grid"></div>
      <p id="feedback" role="status"></p>
    </main>
  </body>
</html>
