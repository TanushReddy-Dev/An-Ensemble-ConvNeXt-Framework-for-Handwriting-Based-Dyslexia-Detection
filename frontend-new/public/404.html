<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | NeuroWrite AI</title>
    <link rel="icon" href="/favicon-32.png" />
    <link rel="stylesheet" href="/assets/ui/recovery.css" />
  </head>
  <body class="static-error">
    <main class="workspace-error">
      <a class="brand" href="/">
        <img
          src="/assets/brand/neurowrite-mark.webp"
          width="28"
          height="28"
          alt=""
        />
        NeuroWrite AI
      </a>
      <div class="workspace-error-body">
        <p class="workspace-error-code">404</p>
        <h1>This page isn't in the workspace.</h1>
        <p>
          The address may have changed. Return to the overview to find your next
          step.
        </p>
        <div class="workspace-error-actions">
          <a class="btn btn--primary" href="/">Back to overview</a>
        </div>
      </div>
      <img
        class="workspace-error-art"
        src="/assets/brand/neurowrite-mark.webp"
        width="384"
        height="384"
        alt=""
      />
    </main>
  </body>
</html>
